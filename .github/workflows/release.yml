name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run package:win

      - name: Create Windows checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'No Windows installer was produced.'
          }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content release/SHA256SUMS-windows.txt -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: porvoz-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error

  package-linux:
    name: Package Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libgbm-dev \
            libgtk-3-dev \
            libnss3-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxt-dev \
            libxtst-dev

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Linux AppImage
        run: npm run package:linux

      - name: Create Linux checksum
        run: |
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          sha256sum "$appimage" > release/SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: porvoz-linux-x64
          path: |
            release/*.AppImage
            release/SHA256SUMS-linux.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - package-windows
      - package-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: porvoz-windows-x64
          path: release/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: porvoz-linux-x64
          path: release/linux

      - name: Assemble release assets
        shell: bash
        run: |
          cp release/windows/*.exe release/
          cp release/linux/*.AppImage release/
          cat release/windows/SHA256SUMS-windows.txt release/linux/SHA256SUMS-linux.txt > release/SHA256SUMS.txt
          find release -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe release/*.AppImage release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "Porvoz $GITHUB_REF_NAME" --generate-notes
